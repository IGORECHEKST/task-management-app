version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: task_management_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-task_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-task_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: task_management_app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-task_management}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-this-is-a-very-secure-and-long-secret-key-for-our-task-management-app}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      DROPBOX_ACCESS_TOKEN: ${DROPBOX_ACCESS_TOKEN:-dummy-dropbox-token}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    restart: unless-stopped

volumes:
  postgres_data:
