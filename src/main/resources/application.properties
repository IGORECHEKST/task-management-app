spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_management}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:this-is-a-very-secure-and-long-secret-key-for-our-task-management-app}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Dropbox Configuration
dropbox.access-token=${DROPBOX_ACCESS_TOKEN:dummy-dropbox-token}

# Mail & Notification Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
notification.mail.from=${MAIL_FROM:noreply@taskmanagement.com}
notification.mail.enabled=${MAIL_ENABLED:false}

